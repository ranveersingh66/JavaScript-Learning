<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tables</title>
</head>
<body>
  <!-- tr: table row -->
  <!-- td: table data/coloumn -->
  <table border="">
    <caption>Fruits and Vegetables</caption>
    <tr>
      <th>Fruit</th>
      <th>Vegetable</th>
    </tr>

    <tr>
      <td>apple</td>
      <td>carrot</td>
    </tr>
  </table>
</body>
</html>
